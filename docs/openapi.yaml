openapi: 3.0.3
info:
  title: GoalMind API
  version: 1.0.0
  description: |
    GoalMind backend contract for the diploma project frontend.

    Success responses use a consistent envelope:
      { "data": ... }

    Error responses use:
      {
        "error": {
          "code": "string",
          "message": "string",
          "details": {}
        }
      }
servers:
  - url: http://localhost:8080
    description: Local development backend
tags:
  - name: Requests
    description: Freeform user request analysis, structured clarification, and plan generation
  - name: Auth
    description: Authentication, session management, and OAuth redirects
  - name: Goals
    description: Goal CRUD operations
  - name: Goal Context
    description: Goal enrichment and planning context
  - name: Tasks
    description: Task tree management and status updates
  - name: Dependencies
    description: Task dependency management
  - name: AI Decomposition
    description: AI-assisted goal and task decomposition
  - name: Progress and Analytics
    description: Progress, feasibility, quality, and usage metrics
  - name: Plan Versions
    description: Versioned AI plans and active plan selection
  - name: Generations
    description: AI generation history and detailed generation payloads
  - name: Feedback
    description: User feedback on AI generations
security:
  - bearerAuth: []
paths:
  /api/requests/analyze:
    post:
      tags: [Requests]
      summary: Analyze a freeform user request
      operationId: analyzeRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeFreeformRequest'
            examples:
              default:
                value:
                  text: изучить Golang за 3 месяца
                  provider: gemini
      responses:
        '200':
          description: Request analyzed and structured clarification questions returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeFreeformEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/requests/{requestId}/answers:
    post:
      tags: [Requests]
      summary: Save structured answers for a previously analyzed request
      operationId: submitRequestAnswers
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequestAnswers'
            examples:
              default:
                value:
                  answers:
                    - questionId: current_level
                      value: beginner
                    - questionId: available_hours_per_day
                      value: 3
                    - questionId: focus_topics
                      value: [practice, project]
      responses:
        '200':
          description: Answers saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitRequestAnswersEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/requests/{requestId}/evaluate:
    post:
      tags: [Requests]
      summary: Evaluate request feasibility after structured answers
      operationId: evaluateRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Feasibility evaluation returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateRequestEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/requests/{requestId}/generate-plan:
    post:
      tags: [Requests]
      summary: Generate a Goal and TaskTree from a freeform request and saved answers
      operationId: generatePlanFromRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '201':
          description: Goal and task tree created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratePlanEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/ai-settings:
    get:
      tags: [Requests]
      summary: Get current user's AI provider settings without exposing API keys
      operationId: getAISettings
      responses:
        '200':
          description: AI settings returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISettingsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Requests]
      summary: Save current user's AI provider API key
      operationId: updateAISettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AISettingsRequest'
            examples:
              gemini:
                value:
                  provider: gemini
                  apiKey: AIza...
      responses:
        '200':
          description: AI settings saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISettingsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                value:
                  name: Anna Petrova
                  email: anna@example.com
                  password: strong-password-123
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: anna@example.com
                  password: strong-password-123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the currently authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/oauth/google/start:
    get:
      tags: [Auth]
      summary: Start Google OAuth authorization flow
      operationId: startGoogleOAuth
      security: []
      responses:
        '302':
          description: Redirect to Google OAuth consent screen
          headers:
            Location:
              description: Google OAuth consent screen URL
              schema:
                type: string
                format: uri
              example: https://accounts.google.com/o/oauth2/v2/auth?client_id=demo-client
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/oauth/google/callback:
    get:
      tags: [Auth]
      summary: Handle Google OAuth callback and redirect to frontend
      operationId: handleGoogleOAuthCallback
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: OAuth authorization code from Google
        - in: query
          name: state
          required: true
          schema:
            type: string
          description: CSRF protection state token
      responses:
        '302':
          description: Redirect to frontend callback route with JWT token
          headers:
            Location:
              description: Frontend callback URL containing the issued JWT
              schema:
                type: string
                format: uri
              example: http://localhost:5173/auth/callback?token=jwt.token.value
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals:
    get:
      tags: [Goals]
      summary: List goals for the authenticated user
      operationId: listGoals
      responses:
        '200':
          description: Goals returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Goals]
      summary: Create a new goal
      operationId: createGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
            examples:
              default:
                value:
                  title: Launch GoalMind diploma MVP
                  description: Prepare a polished demo version for thesis defense
                  category: Education Product
                  priority: HIGH
                  deadline: 2026-06-15
                  availableHoursPerWeek: 18
      responses:
        '201':
          description: Goal created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals/{goalId}:
    get:
      tags: [Goals]
      summary: Get goal details
      operationId: getGoal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Goal returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Goals]
      summary: Update a goal
      operationId: updateGoal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalRequest'
      responses:
        '200':
          description: Goal updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Goals]
      summary: Delete a goal
      operationId: deleteGoal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '204':
          description: Goal deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals/{goalId}/context:
    get:
      tags: [Goal Context]
      summary: Get goal context
      operationId: getGoalContext
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Goal context returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalContextEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Goal Context]
      summary: Create goal context
      operationId: createGoalContext
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertGoalContextRequest'
      responses:
        '201':
          description: Goal context created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalContextEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Goal Context]
      summary: Update goal context
      operationId: updateGoalContext
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertGoalContextRequest'
      responses:
        '200':
          description: Goal context updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalContextEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals/{goalId}/tasks:
    get:
      tags: [Tasks]
      summary: Get the task tree for a goal
      operationId: listGoalTasks
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Goal tasks returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTreeNodesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Tasks]
      summary: Create a task for a goal
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get task details
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Tasks]
      summary: Update a task
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Tasks]
      summary: Delete a task
      operationId: deleteTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: Task deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tasks/{taskId}/status:
    patch:
      tags: [Tasks]
      summary: Update task status
      operationId: updateTaskStatus
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskStatusRequest'
      responses:
        '200':
          description: Task status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tasks/{taskId}/dependencies:
    get:
      tags: [Dependencies]
      summary: List dependencies for a task
      operationId: listTaskDependencies
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Dependencies returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDependenciesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Dependencies]
      summary: Create a dependency for a task
      operationId: createTaskDependency
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskDependencyRequest'
      responses:
        '201':
          description: Dependency created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDependencyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tasks/{taskId}/dependencies/{dependencyId}:
    delete:
      tags: [Dependencies]
      summary: Delete a task dependency
      operationId: deleteTaskDependency
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/DependencyId'
      responses:
        '204':
          description: Dependency deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals/{goalId}/decompose:
    post:
      tags: [AI Decomposition]
      summary: Generate an AI decomposition for a goal
      operationId: decomposeGoal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecomposeGoalRequest'
            examples:
              default:
                value:
                  detailLevel: HIGH
                  includeDependencies: true
                  includeDeadlines: true
      responses:
        '200':
          description: Goal decomposition completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecomposeGoalEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals/{goalId}/regenerate:
    post:
      tags: [AI Decomposition]
      summary: Regenerate an AI plan for a goal
      operationId: regenerateGoal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecomposeGoalRequest'
      responses:
        '200':
          description: Goal plan regenerated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecomposeGoalEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tasks/{taskId}/decompose:
    post:
      tags: [AI Decomposition]
      summary: Decompose a task into subtasks
      operationId: decomposeTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecomposeGoalRequest'
      responses:
        '200':
          description: Task decomposition completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecomposeGoalEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals/{goalId}/progress:
    get:
      tags: [Progress and Analytics]
      summary: Get progress metrics for a goal
      operationId: getGoalProgress
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Progress metrics returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals/{goalId}/feasibility:
    get:
      tags: [Progress and Analytics]
      summary: Get feasibility analysis for a goal
      operationId: getGoalFeasibility
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Feasibility analysis returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeasibilityEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals/{goalId}/quality:
    get:
      tags: [Progress and Analytics]
      summary: Get plan quality score for a goal
      operationId: getGoalQuality
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Quality score returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals/{goalId}/metrics:
    get:
      tags: [Progress and Analytics]
      summary: Get planning and interaction metrics for a goal
      operationId: getGoalMetrics
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Metrics returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals/{goalId}/versions:
    get:
      tags: [Plan Versions]
      summary: List plan versions for a goal
      operationId: listPlanVersions
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Plan versions returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersionsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals/{goalId}/versions/{versionId}:
    get:
      tags: [Plan Versions]
      summary: Get a specific plan version
      operationId: getPlanVersion
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Plan version returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals/{goalId}/versions/{versionId}/activate:
    post:
      tags: [Plan Versions]
      summary: Activate a specific plan version
      operationId: activatePlanVersion
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Plan version activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/goals/{goalId}/generations:
    get:
      tags: [Generations]
      summary: List AI generations for a goal
      operationId: listGoalGenerations
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Generation history returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/generations/{generationId}:
    get:
      tags: [Generations]
      summary: Get detailed information about a generation
      operationId: getGenerationDetails
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: Generation details returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationDetailsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/generations/{generationId}/feedback:
    post:
      tags: [Feedback]
      summary: Submit feedback for a generation
      operationId: createGenerationFeedback
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Feedback stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GoalId:
      in: path
      name: goalId
      required: true
      description: Goal identifier
      schema:
        type: string
        format: uuid
    TaskId:
      in: path
      name: taskId
      required: true
      description: Task identifier
      schema:
        type: string
        format: uuid
    VersionId:
      in: path
      name: versionId
      required: true
      description: Plan version identifier
      schema:
        type: string
        format: uuid
    GenerationId:
      in: path
      name: generationId
      required: true
      description: AI generation identifier
      schema:
        type: string
        format: uuid
    DependencyId:
      in: path
      name: dependencyId
      required: true
      description: Task dependency identifier
      schema:
        type: string
        format: uuid
    RequestId:
      in: path
      name: requestId
      required: true
      description: Freeform planning request identifier
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation_error
              message: One or more request fields are invalid.
              details:
                field: email
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Authentication token is missing or expired.
              details: {}
    Forbidden:
      description: Authenticated user is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: forbidden
              message: You do not have permission to access this resource.
              details: {}
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: The requested resource does not exist.
              details: {}
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: conflict
              message: The requested operation conflicts with existing data.
              details: {}
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: An unexpected error occurred.
              details: {}

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: One or more request fields are invalid.
            details:
              type: object
              additionalProperties: true
              example:
                field: email

    AnalyzeFreeformRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        provider:
          type: string
          enum: [gemini, deepseek]
          description: Optional provider override. If omitted, user settings or server default are used.
      example:
        text: изучить Golang за 3 месяца
        provider: gemini

    RequestFeasibility:
      type: object
      required: [status, reason, blockingFactors, assumptions, requiredClarifications, canGeneratePlan]
      properties:
        status:
          type: string
          enum: [UNKNOWN, NEEDS_CLARIFICATION, FEASIBLE, RISKY, INFEASIBLE, UNSAFE]
        reason:
          type: string
        blockingFactors:
          type: array
          items:
            type: string
        assumptions:
          type: array
          items:
            type: string
        requiredClarifications:
          type: array
          description: Question ids that must still be answered before reliable planning.
          items:
            type: string
        canGeneratePlan:
          type: boolean
          description: The only backend decision flag that allows roadmap generation.

    InterpretedGoal:
      type: object
      required: [title, description, category, deadline, constraints]
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        deadline:
          type: string
          format: date
          nullable: true
        constraints:
          type: array
          items:
            type: string

    ClarifyingQuestionOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string

    ClarifyingQuestion:
      type: object
      required: [id, text, type, required]
      properties:
        id:
          type: string
        text:
          type: string
        type:
          type: string
          enum: [text, textarea, number, date, single_select, multi_select, boolean]
        required:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/ClarifyingQuestionOption'
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        unit:
          type: string
          nullable: true
        placeholder:
          type: string
          nullable: true

    ActivitySignal:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string

    ActivityTracker:
      type: object
      required: [stage, confidence, items]
      properties:
        stage:
          type: string
          enum: [questions_ready, answers_saved, feasibility_evaluated, plan_generated, analysis_ready]
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivitySignal'

    AnalyzeFreeformResponse:
      type: object
      required: [requestId, originalText, interpretedGoal, feasibility, clarifyingQuestions, activityTracker]
      properties:
        requestId:
          type: string
          format: uuid
        originalText:
          type: string
        interpretedGoal:
          $ref: '#/components/schemas/InterpretedGoal'
        feasibility:
          $ref: '#/components/schemas/RequestFeasibility'
        clarifyingQuestions:
          type: array
          items:
            $ref: '#/components/schemas/ClarifyingQuestion'
        activityTracker:
          $ref: '#/components/schemas/ActivityTracker'

    EvaluateRequestResponse:
      type: object
      required: [requestId, feasibility, clarifyingQuestions, activityTracker]
      properties:
        requestId:
          type: string
          format: uuid
        feasibility:
          $ref: '#/components/schemas/RequestFeasibility'
        clarifyingQuestions:
          type: array
          items:
            $ref: '#/components/schemas/ClarifyingQuestion'
        activityTracker:
          $ref: '#/components/schemas/ActivityTracker'

    RequestAnswer:
      type: object
      required: [questionId, value]
      properties:
        questionId:
          type: string
        value:
          description: Answer value shape depends on question type.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                type: string

    SubmitRequestAnswers:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/RequestAnswer'

    SubmitRequestAnswersResponse:
      type: object
      required: [requestId, answersSaved, activityTracker]
      properties:
        requestId:
          type: string
          format: uuid
        answersSaved:
          type: integer
          minimum: 0
        activityTracker:
          $ref: '#/components/schemas/ActivityTracker'

    GeneratePlanResponse:
      type: object
      required: [requestId, feasibility, goal, tasks, progress]
      properties:
        requestId:
          type: string
          format: uuid
        feasibility:
          $ref: '#/components/schemas/RequestFeasibility'
        goal:
          $ref: '#/components/schemas/Goal'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskTreeNode'
        progress:
          $ref: '#/components/schemas/ProgressResponse'

    AISettingsRequest:
      type: object
      required: [provider, apiKey]
      properties:
        provider:
          type: string
          enum: [gemini, deepseek]
        apiKey:
          type: string
          writeOnly: true

    AISettingsResponse:
      type: object
      required: [provider, maskedKey]
      properties:
        provider:
          type: string
          enum: [gemini, deepseek, mock]
        maskedKey:
          type: string

    User:
      type: object
      required: [id, email, name, avatarUrl, provider, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true
        provider:
          type: string
          enum: [LOCAL, GOOGLE]
        createdAt:
          type: string
          format: date-time
      example:
        id: 1cb5df19-0789-4f74-a573-5808479c0566
        email: anna@example.com
        name: Anna Petrova
        avatarUrl: null
        provider: LOCAL
        createdAt: 2026-04-04T09:00:00Z

    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          example: jwt.token.value
        user:
          $ref: '#/components/schemas/User'

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
      example:
        email: anna@example.com
        password: strong-password-123
        name: Anna Petrova

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      example:
        email: anna@example.com
        password: strong-password-123

    Goal:
      type: object
      required:
        [id, title, description, category, priority, status, deadline, availableHoursPerWeek, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          type: string
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        status:
          type: string
          enum: [DRAFT, ACTIVE, COMPLETED, ARCHIVED]
        deadline:
          type: string
          format: date
          nullable: true
        availableHoursPerWeek:
          type: number
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 8cb0c04f-1f22-4827-8e54-6a00cf1c8b79
        title: Launch GoalMind diploma MVP
        description: Prepare a polished demo version of GoalMind for thesis defense.
        category: Education Product
        priority: HIGH
        status: ACTIVE
        deadline: 2026-06-15
        availableHoursPerWeek: 18
        createdAt: 2026-04-12T10:00:00Z
        updatedAt: 2026-05-02T16:40:00Z

    CreateGoalRequest:
      type: object
      required: [title, description, category, priority, deadline, availableHoursPerWeek]
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        deadline:
          type: string
          format: date
          nullable: true
        availableHoursPerWeek:
          type: number
          minimum: 0
      example:
        title: Launch GoalMind diploma MVP
        description: Prepare a polished demo version for thesis defense.
        category: Education Product
        priority: HIGH
        deadline: 2026-06-15
        availableHoursPerWeek: 18

    UpdateGoalRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        status:
          type: string
          enum: [DRAFT, ACTIVE, COMPLETED, ARCHIVED]
        deadline:
          type: string
          format: date
          nullable: true
        availableHoursPerWeek:
          type: number
          minimum: 0

    GoalContext:
      type: object
      required:
        [id, goalId, currentLevel, constraintsText, preferences, expectedResult, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        goalId:
          type: string
          format: uuid
        currentLevel:
          type: string
        constraintsText:
          type: string
        preferences:
          type: array
          items:
            type: string
        expectedResult:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 0ddbb6df-a9ea-44f5-81c4-8f4f2c492c57
        goalId: 8cb0c04f-1f22-4827-8e54-6a00cf1c8b79
        currentLevel: Base dashboard exists, but decomposition and analytics need polishing.
        constraintsText: Frontend must work in demo mode before the backend is ready.
        preferences:
          - Responsive UI
          - Strong metrics
          - Minimal dependencies
        expectedResult: A complete, diploma-ready frontend with typed API integration points.
        createdAt: 2026-04-12T10:00:00Z
        updatedAt: 2026-05-02T16:40:00Z

    UpsertGoalContextRequest:
      type: object
      required: [currentLevel, constraintsText, preferences, expectedResult]
      properties:
        currentLevel:
          type: string
        constraintsText:
          type: string
        preferences:
          type: array
          items:
            type: string
        expectedResult:
          type: string

    Task:
      type: object
      required:
        [id, goalId, parentTaskId, title, description, status, priority, estimatedHours, deadline, orderIndex, source, editedByUser, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        goalId:
          type: string
          format: uuid
        parentTaskId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE, CANCELLED]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        estimatedHours:
          type: number
          minimum: 0
        deadline:
          type: string
          format: date
          nullable: true
        orderIndex:
          type: integer
          minimum: 1
        source:
          type: string
          enum: [AI, MANUAL]
        editedByUser:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: a7516263-5512-4ab3-b377-3644f8640f97
        goalId: 8cb0c04f-1f22-4827-8e54-6a00cf1c8b79
        parentTaskId: fc1118f6-b0dc-43cb-8c9d-46c889474e55
        title: Design dashboard and forms
        description: Create the layout, navigation, auth pages, and data cards.
        status: DONE
        priority: HIGH
        estimatedHours: 10
        deadline: 2026-05-15
        orderIndex: 1
        source: AI
        editedByUser: true
        createdAt: 2026-04-14T10:20:00Z
        updatedAt: 2026-04-29T09:10:00Z

    TaskTreeNode:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          required: [children]
          properties:
            children:
              type: array
              items:
                $ref: '#/components/schemas/TaskTreeNode'

    CreateTaskRequest:
      type: object
      required: [title, description, priority, estimatedHours]
      properties:
        parentTaskId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE, CANCELLED]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        estimatedHours:
          type: number
          minimum: 0
        deadline:
          type: string
          format: date
          nullable: true
        orderIndex:
          type: integer
          minimum: 1

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE, CANCELLED]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        estimatedHours:
          type: number
          minimum: 0
        deadline:
          type: string
          format: date
          nullable: true
        orderIndex:
          type: integer
          minimum: 1
        editedByUser:
          type: boolean

    UpdateTaskStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE, CANCELLED]
      example:
        status: DONE

    TaskDependency:
      type: object
      required: [id, taskId, dependsOnTaskId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        dependsOnTaskId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      example:
        id: 8dd5bdbc-a095-4065-946a-e8f85650d802
        taskId: bf50f527-0c3f-4f09-8498-1d93cd88bbff
        dependsOnTaskId: a7516263-5512-4ab3-b377-3644f8640f97
        createdAt: 2026-04-18T10:20:00Z

    CreateTaskDependencyRequest:
      type: object
      required: [dependsOnTaskId]
      properties:
        dependsOnTaskId:
          type: string
          format: uuid

    DecomposeGoalRequest:
      type: object
      required: [detailLevel, includeDependencies, includeDeadlines]
      properties:
        detailLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        includeDependencies:
          type: boolean
        includeDeadlines:
          type: boolean
      example:
        detailLevel: HIGH
        includeDependencies: true
        includeDeadlines: true

    DecomposeGoalResponse:
      type: object
      required: [goalId, generationId, planVersionId, tasksCreated, qualityScore, feasibilityStatus]
      properties:
        goalId:
          type: string
          format: uuid
        generationId:
          type: string
          format: uuid
        planVersionId:
          type: string
          format: uuid
        tasksCreated:
          type: integer
          minimum: 0
        qualityScore:
          type: integer
          minimum: 0
          maximum: 100
        feasibilityStatus:
          type: string
          enum: [REALISTIC, RISKY, UNREALISTIC, UNKNOWN]
      example:
        goalId: 8cb0c04f-1f22-4827-8e54-6a00cf1c8b79
        generationId: 33767b3e-c8a6-4a9c-9160-6d1ce50de9ad
        planVersionId: cf1d3b62-92ef-41ab-9d6a-7c2c0c7025d0
        tasksCreated: 9
        qualityScore: 86
        feasibilityStatus: REALISTIC

    ProgressResponse:
      type: object
      required:
        [goalId, totalTasks, completedTasks, totalEstimatedHours, completedEstimatedHours, simpleProgressPercent, weightedProgressPercent]
      properties:
        goalId:
          type: string
          format: uuid
        totalTasks:
          type: integer
          minimum: 0
        completedTasks:
          type: integer
          minimum: 0
        totalEstimatedHours:
          type: number
          minimum: 0
        completedEstimatedHours:
          type: number
          minimum: 0
        simpleProgressPercent:
          type: integer
          minimum: 0
          maximum: 100
        weightedProgressPercent:
          type: integer
          minimum: 0
          maximum: 100
      example:
        goalId: 8cb0c04f-1f22-4827-8e54-6a00cf1c8b79
        totalTasks: 11
        completedTasks: 2
        totalEstimatedHours: 75
        completedEstimatedHours: 14
        simpleProgressPercent: 18
        weightedProgressPercent: 19

    FeasibilityResponse:
      type: object
      required: [goalId, weeksUntilDeadline, availableHours, requiredHours, status, message]
      properties:
        goalId:
          type: string
          format: uuid
        weeksUntilDeadline:
          type: integer
          minimum: 0
        availableHours:
          type: number
          minimum: 0
        requiredHours:
          type: number
          minimum: 0
        status:
          type: string
          enum: [REALISTIC, RISKY, UNREALISTIC, UNKNOWN]
        message:
          type: string
      example:
        goalId: 8cb0c04f-1f22-4827-8e54-6a00cf1c8b79
        weeksUntilDeadline: 6
