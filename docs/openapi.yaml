openapi: 3.1.0
info:
  title: mindmap API
  version: 1.0.0
  description: API для AI-декомпозиции пользовательских целей.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      security: []
      responses:
        "200": { description: API доступен }
  /api/auth/register:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RegisterRequest" } } } }
      responses: { "201": { $ref: "#/components/responses/AuthResponse" } }
  /api/auth/login:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/AuthResponse" } }
  /api/auth/me:
    get:
      responses: { "200": { description: Текущий пользователь } }
  /api/auth/oauth/google/start:
    get:
      security: []
      responses: { "302": { description: Переход в Google OAuth } }
  /api/auth/oauth/google/callback:
    get:
      security: []
      responses: { "302": { description: Возврат в приложение с токеном } }
  /api/profile:
    get:
      responses: { "200": { description: Профиль }, "404": { description: Профиль ещё не заполнен } }
    put:
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UserProfileInput" } } } }
      responses: { "200": { description: Профиль сохранён } }
  /api/ai-settings:
    get:
      responses: { "200": { description: Провайдер и маска ключа } }
    put:
      description: Проверяет ключ тестовым запросом и сохраняет его в зашифрованном виде.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AISettingsInput" } } } }
      responses: { "200": { description: Ключ проверен и сохранён }, "422": { description: Ключ не прошёл проверку } }
  /api/requests/analyze:
    post:
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 2000 } } } } } }
      responses: { "200": { description: Интерпретация и 3–15 уточняющих вопросов } }
  /api/requests/{requestId}/answers:
    post:
      parameters: [ { $ref: "#/components/parameters/RequestId" } ]
      responses: { "200": { description: Ответы сохранены } }
  /api/requests/{requestId}/evaluate:
    post:
      parameters: [ { $ref: "#/components/parameters/RequestId" } ]
      responses: { "200": { description: Оценка реалистичности и возможная корректировка } }
  /api/requests/{requestId}/generate-plan:
    post:
      parameters: [ { $ref: "#/components/parameters/RequestId" } ]
      responses: { "200": { description: Создана цель с двухуровневым деревом } }
  /api/goals:
    get:
      responses: { "200": { description: Цели пользователя в порядке создания } }
  /api/goals/{goalId}:
    get:
      parameters: [ { $ref: "#/components/parameters/GoalId" } ]
      responses: { "200": { description: Цель } }
    put:
      parameters: [ { $ref: "#/components/parameters/GoalId" } ]
      responses: { "200": { description: Цель обновлена } }
    delete:
      parameters: [ { $ref: "#/components/parameters/GoalId" } ]
      responses: { "204": { description: Цель удалена } }
  /api/goals/{goalId}/tasks:
    get:
      parameters: [ { $ref: "#/components/parameters/GoalId" } ]
      responses: { "200": { description: Двухуровневое дерево этапов и шагов } }
    post:
      parameters: [ { $ref: "#/components/parameters/GoalId" } ]
      responses: { "201": { description: Этап или шаг добавлен } }
  /api/goals/{goalId}/progress:
    get:
      parameters: [ { $ref: "#/components/parameters/GoalId" } ]
      responses: { "200": { description: Доля выполненных конечных шагов } }
  /api/goals/{goalId}/regenerate:
    post:
      description: Полностью заменяет дерево и сбрасывает прогресс.
      parameters: [ { $ref: "#/components/parameters/GoalId" } ]
      responses: { "200": { description: План перестроен } }
  /api/tasks/{taskId}:
    put:
      parameters: [ { $ref: "#/components/parameters/TaskId" } ]
      responses: { "200": { description: Шаг обновлён } }
    delete:
      parameters: [ { $ref: "#/components/parameters/TaskId" } ]
      responses: { "204": { description: Шаг и его дочерние элементы удалены } }
  /api/tasks/{taskId}/status:
    patch:
      description: Допустимы TODO и DONE. DONE запрещён, пока зависимости не завершены.
      parameters: [ { $ref: "#/components/parameters/TaskId" } ]
      responses: { "200": { description: Статус обновлён }, "409": { description: Шаг заблокирован зависимостью } }
  /api/tasks/{taskId}/dependencies:
    get:
      parameters: [ { $ref: "#/components/parameters/TaskId" } ]
      responses: { "200": { description: Зависимости шага } }
    post:
      parameters: [ { $ref: "#/components/parameters/TaskId" } ]
      responses: { "201": { description: Зависимость добавлена } }
  /api/tasks/{taskId}/dependencies/{dependencyId}:
    delete:
      parameters: [ { $ref: "#/components/parameters/TaskId" }, { name: dependencyId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { "204": { description: Зависимость удалена } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    RequestId: { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    GoalId: { name: goalId, in: path, required: true, schema: { type: string, format: uuid } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    AuthResponse:
      description: Сессия создана
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties: { name: { type: string }, email: { type: string, format: email }, password: { type: string, minLength: 8 } }
    LoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string } }
    UserProfileInput:
      type: object
      required: [age, occupation, freeHoursPerWeek, availableBudget, constraints]
      properties:
        age: { type: integer, minimum: 14, maximum: 120 }
        occupation: { type: string }
        freeHoursPerWeek: { type: number, exclusiveMinimum: 0, maximum: 168 }
        availableBudget: { type: number, minimum: 0 }
        constraints: { type: string }
    AISettingsInput:
      type: object
      required: [provider, apiKey]
      properties:
        provider: { type: string, enum: [gemini, deepseek] }
        apiKey: { type: string }
